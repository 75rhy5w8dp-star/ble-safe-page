<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08090d">
  <title>蓝牙玩具中转</title>
  <style>
    :root{--ink:#f6f7fb;--muted:#969bab;--line:#ffffff17;--violet:#8b7cff;--green:#59d7a4;--red:#ff6f7f}*{box-sizing:border-box}html{background:#08090d}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% -10%,#705cff3d,transparent 35rem),#08090d;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.shell{min-height:100svh;padding:max(22px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom));display:grid;place-items:center}.card{width:min(100%,430px);padding:8px 4px 18px}header{display:flex;justify-content:space-between;padding:2px 2px 18px}.eyebrow{margin:0 0 7px;color:#b6adff;font-size:11px;font-weight:700;letter-spacing:.18em}h1{margin:0;font-size:30px}.dot{width:12px;height:12px;margin-top:13px;border-radius:50%;background:#575b67;box-shadow:0 0 0 7px #ffffff09}.dot.connecting{background:#f4c86a;animation:pulse 1.2s infinite}.dot.ready{background:var(--green);box-shadow:0 0 0 7px #59d7a41c}.dot.error{background:var(--red)}.hero{min-height:230px;border:1px solid var(--line);border-radius:30px;background:#191b24db;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px}.orbit{width:105px;height:105px;border:1px solid #b6adff40;border-radius:50%;display:grid;place-items:center}.core{width:66px;height:66px;border-radius:24px;background:linear-gradient(145deg,#9d90ff,#6e5ded);display:flex;align-items:center;justify-content:center;gap:5px}.core i{width:6px;border-radius:6px;background:#fff}.core i:nth-child(1){height:16px}.core i:nth-child(2){height:28px}.core i:nth-child(3){height:21px}.status{margin:20px 0 7px;font-size:19px;font-weight:700}.help{margin:0;color:var(--muted);font-size:13px;text-align:center}.actions{display:grid;gap:11px;margin-top:15px}button{min-height:52px;border-radius:16px;border:0;font:inherit;font-weight:700;cursor:pointer}.primary{color:#0d0c16;background:linear-gradient(135deg,#c0b9ff,#8878ff)}button:disabled{opacity:.55}.test{background:linear-gradient(135deg,#8cecc7,#4fd09c)}.stop{color:#ffb3bb;background:#ff6f7f1a;border:1px solid #ff6f7f42}.text{min-height:42px;color:var(--muted);background:transparent}.box{margin-top:14px;padding:17px;border:1px solid var(--line);border-radius:20px;background:#12141bc7}.info{display:flex;gap:12px;align-items:center}.info b{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;color:#d7d2ff;background:#8b7cff29;font-size:12px}.info p,.relay p{margin:0;color:#c4c7d0;font-size:13px;line-height:1.55}.control{margin-top:16px}.control label{display:flex;justify-content:space-between;color:#c4c7d0;font-size:13px}.control output{color:#b9b1ff;font-weight:700}.control input{width:100%;margin-top:10px;accent-color:var(--violet)}.control-buttons,.relay-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.rampage{color:#17101a;background:linear-gradient(135deg,#ffb278,#ff718f)}.safety ul{margin:10px 0 0;padding-left:18px;color:#8f94a1;font-size:12px;line-height:1.8}.relay p{margin-top:7px}.relay input{min-width:0;height:48px;padding:0 12px;border:1px solid var(--line);border-radius:14px;outline:0;color:var(--ink);background:#0d0f15;font:inherit;font-size:12px}.relay button{min-height:48px;color:#0d0c16;background:#b9b1ff}.relay-output{margin-top:11px!important}.received{color:var(--green)!important}.note{margin:16px 0 0;color:#707482;font-size:11px;text-align:center}.hidden{display:none!important}@keyframes pulse{50%{opacity:.55}}
  </style>
</head>
<body><main class="shell"><section class="card">
  <header><div><p class="eyebrow">BLUEFY · IOS</p><h1>蓝牙中转</h1></div><span id="dot" class="dot"></span></header>
  <div class="hero"><div class="orbit"><div class="core"><i></i><i></i><i></i></div></div><p id="status" class="status">等待连接</p><p id="help" class="help">支持 COCO 与 SVAKOM 分欣 Plus（SL278H）。</p></div>
  <div class="actions"><button id="connect" class="primary">连接玩具</button><button id="test" class="primary test hidden">1 秒轻触测试</button><button id="stop" class="stop hidden">立即停止</button><button id="disconnect" class="text hidden">断开蓝牙</button></div>
  <div class="box info" role="status" aria-live="polite"><b>i</b><p id="log">页面已就绪。</p></div>
  <section id="cocoControls" class="box hidden"><strong>COCO 两路控制</strong>
    <div class="control"><label for="suction">吮吸 <output id="suctionValue">0</output></label><input id="suction" type="range" min="0" max="20" step="1" value="0"></div>
    <div class="control"><label for="vibration">舌舔震动 <output id="vibrationValue">0</output></label><input id="vibration" type="range" min="0" max="20" step="1" value="0"></div>
    <div class="control-buttons"><button id="rampage" class="rampage">暴走 · 全拉满</button><button id="cocoStop" class="stop">两路停止</button></div>
  </section>
  <aside class="box safety"><strong>连接保护</strong><ul><li>只请求 FFE0 / FFE1 或 FF60 / FF61 控制通道</li><li>不扫描、不访问 AE00 / AE01 固件通道</li><li>页面离开前台或蓝牙断开时立即尝试停止</li></ul></aside>
  <section class="box relay"><strong>云端远程中转</strong><p>地址和密码只保存在本机；过期指令自动丢弃。</p><div class="relay-row"><input id="relayUrl" inputmode="url" placeholder="https://你的地址.onrender.com"><button id="relayStart">连接中转</button></div><div class="relay-row"><input id="relaySecret" type="password" placeholder="控制密码"><button id="relayStop">停止接收</button></div><p id="relayOutput" class="relay-output">尚未连接中转。</p></section>
  <p class="note">Bluefy 必须保持在前台；实体按键永远可以紧急停止。</p>
</section></main>
<script type="module">
import {COCO,cocoSet,cocoStopAll} from "./coco-protocol.js?v=20260913-motor-map-v2";
import {normalizeRhythmRequest,rhythmStepAt} from "./rhythm-program.js?v=20260914-local-rhythm-v1";
const SVAKOM={service:"0000ffe0-0000-1000-8000-00805f9b34fb",characteristic:"0000ffe1-0000-1000-8000-00805f9b34fb"};
const SVAKOM_STOP=new Uint8Array([0x55,0x04,0,0,0,0,0xaa]);
let device=null,characteristic=null,profile=null,testTimer=null,relayTimer=null,heartbeatTimer=null,lastEventId="";
let rhythmTimer=null,rhythmToken=0;
const $=id=>document.getElementById(id);
function ui(state,title,message){$("dot").className="dot "+state;$("status").textContent=title;$("log").textContent=message;const ready=state==="ready";$("connect").classList.toggle("hidden",ready);["test","stop","disconnect"].forEach(id=>$(id).classList.toggle("hidden",!ready));$("cocoControls").classList.toggle("hidden",!(ready&&profile==="coco"));$("help").textContent=ready?"手机请放在设备附近，并保持 Bluefy 在前台。":"支持 COCO 与 SVAKOM 分欣 Plus（SL278H）。"}
async function write(bytes){if(!characteristic)throw new Error("设备还没有连接");if(characteristic.writeValueWithoutResponse)await characteristic.writeValueWithoutResponse(bytes);else await characteristic.writeValue(bytes)}
function resetCocoUi(){for(const id of ["suction","vibration"]){$(id).value=0;$(id+"Value").value=0}}
function showCocoLevels(suction,vibration){$("suction").value=suction;$("suctionValue").value=suction;$("vibration").value=vibration;$("vibrationValue").value=vibration}
function cancelRhythm(){rhythmToken+=1;if(rhythmTimer){clearTimeout(rhythmTimer);rhythmTimer=null}}
async function safeStop(quiet=false){cancelRhythm();if(testTimer){clearTimeout(testTimer);testTimer=null}$("test").disabled=false;resetCocoUi();if(!characteristic){if(!quiet)$("log").textContent="当前没有正在运行的设备。";return}try{await write(profile==="coco"?cocoStopAll():SVAKOM_STOP);if(!quiet)$("log").textContent="已取消后台节奏并发送全停，两路归零。"}catch{if(!quiet)$("log").textContent="停止未送达，请用设备实体按键停止。"}}
function startLocalRhythm(input){if(profile!=="coco"||!characteristic)throw new Error("COCO 蓝牙尚未连接");cancelRhythm();const settings=normalizeRhythmRequest(input);const token=rhythmToken;const endsAt=Date.now()+settings.durationMs;let index=0;const tick=async()=>{if(token!==rhythmToken)return;if(Date.now()>=endsAt){await safeStop();$("log").textContent="本地节奏已到时，两路已停止。";return}const step=rhythmStepAt(index++,settings.maxLevel);try{await write(cocoSet(COCO.suction,step.suction));if(token!==rhythmToken)return;await write(cocoSet(COCO.vibration,step.vibration));if(token!==rhythmToken)return;showCocoLevels(step.suction,step.vibration);$("log").textContent="本地节奏运行中 · 吮吸 "+step.suction+"/20 · 舌舔 "+step.vibration+"/20";const delay=Math.min(step.holdMs,Math.max(0,endsAt-Date.now()));rhythmTimer=setTimeout(tick,delay)}catch(e){if(token===rhythmToken){await safeStop(true);$("log").textContent=e?.message||"本地节奏已因写入失败而停止。"}}};void tick();return settings}
$("connect").onclick=async()=>{if(!navigator.bluetooth){ui("error","浏览器不支持蓝牙","请确认正在 Bluefy 中打开，而不是 Safari。");return}ui("connecting","正在寻找设备","请选择 COCO 或名称以 SL278 开头的设备。");$("connect").disabled=true;try{device=await navigator.bluetooth.requestDevice({filters:[{name:"COCO"},{namePrefix:"SL278"}],optionalServices:[COCO.service,SVAKOM.service]});device.addEventListener("gattserverdisconnected",()=>{characteristic=device=profile=null;resetCocoUi();ui("","连接已断开","让手机靠近设备后再连接。");$("connect").disabled=false});const server=await device.gatt.connect();profile=(device.name||"").toUpperCase()==="COCO"?"coco":"svakom";const selected=profile==="coco"?COCO:SVAKOM;const service=await server.getPrimaryService(selected.service);characteristic=await service.getCharacteristic(selected.characteristic);ui("ready","已连接 · "+(device.name||"设备"),"已连接控制通道 "+(profile==="coco"?"FF61":"FFE1")+"。")}catch(e){characteristic=device=profile=null;ui("error","连接没有完成",e?.message||"请确认设备已开机并靠近手机。")}$("connect").disabled=false};
$("test").onclick=async()=>{if(!characteristic||testTimer)return;$("test").disabled=true;$("log").textContent="轻触测试中，1 秒后自动停止。";try{if(profile==="coco")await write(cocoSet(COCO.suction,1));else await write(new Uint8Array([0x55,0x04,0,0,1,Math.round(.15*255),0xaa]));testTimer=setTimeout(async()=>{await safeStop();$("log").textContent="测试完成，设备已停止。"},1000)}catch(e){$("test").disabled=false;$("log").textContent=e?.message||"测试指令未能发送。"}};
$("stop").onclick=()=>safeStop();$("cocoStop").onclick=()=>safeStop();$("disconnect").onclick=async()=>{await safeStop(true);if(device?.gatt?.connected)device.gatt.disconnect();characteristic=device=profile=null;ui("","等待连接","已断开。")} ;
async function setCocoMotor(id,mask){if(profile!=="coco")return;cancelRhythm();const level=Number($(id).value);$(id+"Value").value=level;try{await write(cocoSet(mask,level));$("log").textContent=(id==="suction"?"吮吸":"舌舔震动")+"已设为 "+level+"/20。"}catch(e){$("log").textContent=e?.message||"指令未能发送。"}}
for(const [id,mask] of [["suction",COCO.suction],["vibration",COCO.vibration]]){$(id).oninput=()=>$(id+"Value").value=$(id).value;$(id).onchange=()=>setCocoMotor(id,mask)}
$("rampage").onclick=async()=>{if(profile!=="coco")return;cancelRhythm();await write(cocoSet(COCO.suction,20));await write(cocoSet(COCO.vibration,20));showCocoLevels(20,20);$("log").textContent="暴走已开启：两路 20/20。"};
const relayBase=()=>$("relayUrl").value.trim().replace(/\/+$/ ,"");const authHeaders=()=>({Authorization:"Bearer "+$("relaySecret").value.trim()});
async function applyRemote(command){if(!characteristic)throw new Error("蓝牙尚未连接");if(command.target&&command.target!==profile)throw new Error("指令目标与当前设备不一致");if(command.action==="stop"){await safeStop(true);return "已取消后台节奏并执行远程全停，两路归零"}if(profile==="coco"){if(command.action==="start_rhythm"){const settings=startLocalRhythm(command);return "本地节奏已启动 · 最长 "+Math.round(settings.durationMs/60_000)+" 分钟 · 最高 "+settings.maxLevel+"/20"}cancelRhythm();if(command.action==="rampage"){await write(cocoSet(COCO.suction,20));await write(cocoSet(COCO.vibration,20));showCocoLevels(20,20);return "已执行暴走：两路 20/20"}const map={set_suction:["suction",COCO.suction,"吮吸"],set_vibration:["vibration",COCO.vibration,"舌舔震动"]};const item=map[command.action];if(item){$(item[0]).value=command.level;$(item[0]+"Value").value=command.level;await write(cocoSet(item[1],command.level));return item[2]+" "+command.level+"/20"}}if(profile==="svakom"&&command.action==="set_speed"){cancelRhythm();const pct=Math.max(0,Math.min(100,command.percent));const value=Math.round(pct*2.55);await write(new Uint8Array([0x55,0x04,0,0,value?1:0,value,0xaa]));return "SVAKOM 强度 "+pct+"%"}throw new Error("当前设备不支持这条指令")}
async function poll(){const base=relayBase();if(!/^https:\/\/[a-z0-9.-]+$/i.test(base)||!$("relaySecret").value.trim()){$("relayOutput").textContent="请填写云端地址和控制密码。";return}try{const response=await fetch(base+"/api/control/latest?after="+encodeURIComponent(lastEventId),{headers:authHeaders(),cache:"no-store"});if(!response.ok)throw new Error(response.status===401?"控制密码不正确":"中转 HTTP "+response.status);const data=await response.json();if(data.event){lastEventId=data.event.id;$("relayOutput").textContent=(await applyRemote(data.event.command))+" · "+new Date().toLocaleTimeString();$("relayOutput").className="relay-output received"}else if(!lastEventId)$("relayOutput").textContent="中转已连接，正在等待指令。"}catch(e){$("relayOutput").className="relay-output";$("relayOutput").textContent=e?.message||"中转暂时断线，正在重试。"}}
async function heartbeat(){if(!characteristic)return;await fetch(relayBase()+"/api/bridge/heartbeat",{method:"POST",headers:{...authHeaders(),"Content-Type":"application/json"},body:JSON.stringify({device:profile,name:device?.name||null}),cache:"no-store"})}
$("relayStart").onclick=()=>{if(relayTimer)clearInterval(relayTimer);if(heartbeatTimer)clearInterval(heartbeatTimer);lastEventId="";localStorage.setItem("relayUrl",relayBase());localStorage.setItem("relaySecret",$("relaySecret").value);poll();heartbeat().catch(()=>{});relayTimer=setInterval(poll,700);heartbeatTimer=setInterval(()=>heartbeat().catch(()=>{}),5000)};
$("relayStop").onclick=()=>{clearInterval(relayTimer);clearInterval(heartbeatTimer);relayTimer=heartbeatTimer=null;$("relayOutput").textContent="已停止接收远程指令。"};$("relayUrl").value=localStorage.getItem("relayUrl")||localStorage.getItem("safeRelayUrl")||"";$("relaySecret").value=localStorage.getItem("relaySecret")||"";
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")safeStop(true)});window.addEventListener("pagehide",()=>{safeStop(true);clearInterval(relayTimer);clearInterval(heartbeatTimer)});
</script></body></html>
